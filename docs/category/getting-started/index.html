<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to /docs/getting-started/</title>
    <meta http-equiv="refresh" content="0; url=/docs/getting-started/" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://mutative.js.org/docs/getting-started/" />
    <script>
      location.replace("/docs/getting-started/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <a href="/docs/getting-started/">/docs/getting-started/</a>
  </body>
</html>
