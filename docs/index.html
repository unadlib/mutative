<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to /docs/intro/</title>
    <meta http-equiv="refresh" content="0; url=/docs/intro/" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://mutative.js.org/docs/intro/" />
    <script>
      location.replace("/docs/intro/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <a href="/docs/intro/">/docs/intro/</a>
  </body>
</html>
