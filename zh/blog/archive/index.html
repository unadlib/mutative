<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to /zh/blog/</title>
    <meta http-equiv="refresh" content="0; url=/zh/blog/" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://mutative.js.org/zh/blog/" />
    <script>
      location.replace("/zh/blog/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <a href="/zh/blog/">/zh/blog/</a>
  </body>
</html>
