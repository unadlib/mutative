<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to /blog/</title>
    <meta http-equiv="refresh" content="0; url=/blog/" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://mutative.js.org/blog/" />
    <script>
      location.replace("/blog/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <a href="/blog/">/blog/</a>
  </body>
</html>
