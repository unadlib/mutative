name: Node.js Package

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # npm trusted publishing needs npm 11.5.1 or later, which Node.js 24
      # ships; it publishes with OIDC and attaches provenance itself.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
      - run: pnpm type-check
      - run: pnpm build
      - run: pnpm size
      - run: pnpm test:package
      - run: pnpm test:build-watch
      - run: pnpm test
      - run: npm publish
        env:
          CI: true
