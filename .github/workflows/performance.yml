name: Performance budgets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: Paired performance budgets (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [core, collections, objects]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: benchmark-base
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm
      - name: Install and build the PR base
        run: |
          pnpm --dir benchmark-base install --frozen-lockfile
          pnpm --dir benchmark-base build
      - name: Install candidate dependencies and validate budget tooling
        run: |
          pnpm install --frozen-lockfile
          node --test perf-testing/regression.test.mjs
      - name: Compare base and candidate sequentially on this runner
        run: pnpm benchmark:ci --base-dir benchmark-base --group ${{ matrix.group }}
      - name: Upload every measurement and budget decision
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-budget-results-${{ matrix.group }}
          path: perf-testing/results/ci/
          if-no-files-found: warn
