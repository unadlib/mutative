name: Node CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: pnpm
    - name: pnpm install, lint, format check, build, package checks, type-check, and test
      run: |
        pnpm install --frozen-lockfile
        pnpm lint
        pnpm format --check
        pnpm build
        pnpm exec oxfmt --check 'perf-testing/*.mjs' perf-testing/README.md perf-testing/budgets.json
        pnpm benchmark:immer:build
        node --expose-gc --enable-source-maps perf-testing/dist/immutability-benchmarks.mjs --check --patches both --object-size-1 10 --object-size-2 30 --rtkq-count 10
        node --expose-gc --enable-source-maps perf-testing/dist/immutability-benchmarks.mjs --check --patches off --filter '^apply-'
        pnpm test:benchmarks
        pnpm size
        pnpm test:package
        pnpm test:build-watch
        pnpm type-check
        pnpm test
      env:
        CI: true
