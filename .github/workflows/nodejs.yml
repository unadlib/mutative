name: Node CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: pnpm
    - name: pnpm install, lint, format check, build, package checks, type-check, and test
      run: |
        pnpm install --frozen-lockfile
        pnpm lint
        pnpm format --check
        pnpm build
        pnpm size
        pnpm test:package
        pnpm test:build-watch
        pnpm type-check
        pnpm test
      env:
        CI: true
